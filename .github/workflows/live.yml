# Actualiza live.js (GitHub + Spotify) cada día. El commit dispara el despliegue en Cloudflare.
name: Datos en vivo
on:
  schedule:
    - cron: "0 11 * * *" # 6:00 en Colombia
  workflow_dispatch:
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/live.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.js
          git diff --cached --quiet || (git commit -m "Actualiza datos en vivo" && git push)
